<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download The Three Things APK</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #FAF7F2;
      color: #2D2A26;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: #F5F0E8;
      border: 1px solid #E6DFD5;
      border-radius: 28px;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      background: #E6DFD5;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #78716A;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 1.75rem;
      font-family: Georgia, serif;
      font-style: italic;
      color: #2D2A26;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.875rem;
      color: #78716A;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .btn {
      display: block;
      width: 100%;
      background: #DA7756;
      color: #FFFFFF;
      font-weight: 600;
      font-size: 1rem;
      padding: 1rem 1.5rem;
      border-radius: 18px;
      text-decoration: none;
      transition: background 0.15s ease, transform 0.1s ease;
      box-shadow: 0 2px 8px rgba(218, 119, 86, 0.25);
    }
    .btn:active {
      transform: scale(0.98);
      background: #C86446;
    }
    .subtext {
      margin-top: 1.25rem;
      font-size: 0.75rem;
      color: #78716A;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Direct APK Download</div>
    <h1>The Three Things</h1>
    <p>Fresh build with minimalist focus reminders and local notification settings.</p>
    
    <a id="download-btn" href="TheThreeThings.apk" class="btn" download="TheThreeThings.apk">
      Download APK (5 MB)
    </a>

    <div class="subtext">
      Tap above to download directly to your device.
    </div>
  </div>

  <script>
    // Automatic download trigger with cache busting
    window.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('download-btn');
      const timestamp = Date.now();
      btn.href = 'TheThreeThings.apk?t=' + timestamp;
      
      // Auto-trigger download after 1 second
      setTimeout(() => {
        btn.click();
      }, 800);
    });
  </script>
</body>
</html>
