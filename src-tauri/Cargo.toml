[package]
name = "the-three-things"
version = "0.1.0"
description = "The Three Things"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "the_three_things_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
